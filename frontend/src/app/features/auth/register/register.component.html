<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="#1B3A6B" stroke-width="2" stroke-linecap="round">
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
        </svg>
        <span>JobPortal</span>
      </div>
      <h1>Create your account</h1>
      <p>Join thousands of job seekers and employers</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="role-selector">
        <button
          type="button"
          class="role-btn"
          [class.active]="role.value === Role.JOBSEEKER"
          (click)="selectRole(Role.JOBSEEKER)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Job Seeker</span>
          <small>Find your next role</small>
        </button>

        <button
          type="button"
          class="role-btn"
          [class.active]="role.value === Role.EMPLOYER"
          (click)="selectRole(Role.EMPLOYER)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2"/>
            <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
          </svg>
          <span>Employer</span>
          <small>Post jobs &amp; hire</small>
        </button>
      </div>

      <div class="form-group">
        <label for="name">Full name</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="Enter your name"
          autocomplete="name"
          [class.error]="name.invalid && name.touched"
        />
        <span class="error-msg" *ngIf="name.touched && name.hasError('required')">
          Name is required
        </span>
        <span class="error-msg" *ngIf="name.touched && name.hasError('minlength')">
          Name must be at least 2 characters
        </span>
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
          [class.error]="email.invalid && email.touched"
        />
        <span class="error-msg" *ngIf="email.touched && email.hasError('required')">
          Email is required
        </span>
        <span class="error-msg" *ngIf="email.touched && email.hasError('email')">
          Enter a valid email
        </span>
      </div>

      <div class="form-group">
        <label for="phone">Phone number <span class="optional">(optional)</span></label>
        <input
          id="phone"
          type="tel"
          formControlName="phoneNumber"
          placeholder="9876543210"
          autocomplete="tel"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Min. 6 characters"
            autocomplete="new-password"
            [class.error]="password.invalid && password.touched"
          />
          <button
            type="button"
            class="toggle-pw"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <svg *ngIf="!showPassword" width="16" height="16"
                 viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="16" height="16"
                 viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8
                       a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8
                       a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="error-msg" *ngIf="password.touched && password.hasError('required')">
          Password is required
        </span>
        <span class="error-msg" *ngIf="password.touched && password.hasError('minlength')">
          Must be at least 6 characters
        </span>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading">
        <span *ngIf="!loading">Create account</span>
        <span *ngIf="loading" class="spinner" aria-hidden="true"></span>
      </button>

    </form>

    <p class="auth-footer">
      Already have an account?
      <a routerLink="/login">Log in</a>
    </p>

  </div>
</div>
